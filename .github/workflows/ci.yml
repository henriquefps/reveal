name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # No secrets here: the release is signed locally with `skv run reveal -- ./gradlew :app:assembleRelease`.
      - name: Quality gates (unit tests, screenshots, lint, ktlint, detekt)
        run: ./gradlew qa
      - name: Debug build
        run: ./gradlew :app:assembleDebug
