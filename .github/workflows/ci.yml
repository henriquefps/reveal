name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The pinned models (core/ml/models.json; big-LaMa's source file alone is 205 MB): keyed by the manifest.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/reveal-ml
          key: reveal-ml-${{ hashFiles('core/ml/models.json') }}
          restore-keys: reveal-ml-
      # No secrets here: the release is signed locally with `skv run reveal -- ./gradlew :app:assembleRelease`.
      - name: Quality gates (unit tests, screenshots, lint, ktlint, detekt)
        run: ./gradlew qa
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: |
            **/build/outputs/roborazzi/**
            **/build/reports/tests/**
          if-no-files-found: ignore
      - name: Debug build
        run: ./gradlew :app:assembleDebug
