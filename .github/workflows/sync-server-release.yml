name: Sync server release

# Push a tag like sync-server-v0.1.0 to publish static binaries (linux amd64 + arm64) to a GitHub release and the
# multi-arch image to ghcr.io/henriquefps/reveal-sync. App releases keep their own v* tags.
on:
  push:
    tags:
      - "sync-server-v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sync-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sync-server/go.mod
          cache-dependency-path: sync-server/go.sum

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#sync-server-v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test -count=1 ./...

      - name: Build archives
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            out=dist/reveal-sync_linux_$arch
            mkdir -p $out
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }} -X main.commit=${GITHUB_SHA::7}" \
              -o $out/reveal-sync .
            cp README.md docker-compose.yml ../LICENSE $out/
            tar -C dist -czf dist/reveal-sync_linux_$arch.tar.gz reveal-sync_linux_$arch
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Sync server ${{ steps.v.outputs.version }}" \
            --notes "reveal-sync ${{ steps.v.outputs.version }}: see sync-server/README.md and docs/adr/0017-sync-protocol.md." \
            dist/*.tar.gz dist/checksums.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image (linux/amd64, linux/arm64)
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=${{ steps.v.outputs.version }} --build-arg COMMIT=${GITHUB_SHA::7} \
            --label org.opencontainers.image.source=https://github.com/henriquefps/reveal \
            --label org.opencontainers.image.licenses=AGPL-3.0-or-later \
            -t ghcr.io/henriquefps/reveal-sync:${{ steps.v.outputs.version }} -t ghcr.io/henriquefps/reveal-sync:latest .
